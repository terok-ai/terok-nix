name: Nix Checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  nix-checks-ubuntu:
    name: Nix flake check on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: |
          nix flake check --verbose
  integration-tests-ubuntu:
    name: Integration tests on Ubuntu
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-26.05
      - run: |
          sudo apt install -y nftables podman
          nix run .#python3Packages.terok-util.integration-tests
          nix run .#python3Packages.terok-sandbox.integration-tests
          nix run .#python3Packages.terok-clearance.integration-tests
          nix run .#python3Packages.terok-shield.integration-tests
          nix run .#terok.integration-tests
